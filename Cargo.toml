[package]
name = "peng"
version = "0.1.0"
edition = "2021"
description = "Ultra-light personal accountability companion for competitive programming"

[lib]
name = "peng_lib"
path = "src/lib.rs"

[[bin]]
name = "peng"
path = "src/bin/peng.rs"

[[bin]]
name = "peng-bench"
path = "src/bin/peng_bench.rs"

[features]
default = ["tray"]
tray = ["dep:tray-icon"]

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
native-tls = "0.2"
tray-icon = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"

# Dev builds were 10 GB with full debuginfo across ~600 crates. Line tables
# keep backtraces line-accurate while cutting artifact size ~10x.
[profile.dev]
debug = "line-tables-only"
